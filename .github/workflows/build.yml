name: OpenWRT CR660X Cloud Compilation

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        default: 'master'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout config repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ccache libncurses-dev gawk flex bison \
            unzip gettext zlib1g-dev libssl-dev python3 python3-pyelftools rsync \
            subversion swig texinfo uglifyjs upx-ucl xmlto xxd xz-utils

      - name: Clone OpenWRT source
        run: |
          git clone --depth 1 -b ${{ github.event.inputs.branch || 'master' }} https://github.com/coolsnowwolf/lede openwrt

      - name: Apply custom configuration
        run: |
          cp .config openwrt/.config
          cp diy-config.sh openwrt/diy-config.sh
          chmod +x openwrt/diy-config.sh

      - name: Run diy-config
        working-directory: ./openwrt
        run: ./diy-config.sh

      - name: Compile firmware
        working-directory: ./openwrt
        run: make -j1 V=s

      - name: Prepare release assets
        run: |
          mkdir -p release
          find openwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-cr660x-${{ github.run_number }}
          path: release/
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cr660x-${{ github.run_number }}-${{ github.run_attempt }}
          name: OpenWRT CR660X ${{ github.run_number }}
          body: |
            OpenWRT CR660X 自动编译固件

            - 默认 IP: 192.168.66.1
            - 主题: Argon
            - DNS: MosDNS (第三方仓库)
            - 目标: ramips/mt7621
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
