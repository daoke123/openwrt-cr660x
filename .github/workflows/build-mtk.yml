name: OpenWrt CR660X Lean LEDE (Closed-Source mt_wifi)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Lean LEDE 分支（master / openwrt-23.05 等）"
        required: false
        default: "master"
      device:
        description: "设备：all / cr6606 / cr6608 / cr6609"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: lede-mtk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 CR660X 固件 (闭源 mt_wifi)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DEVICE: ${{ github.event.inputs.device }}
      BRANCH: ${{ github.event.inputs.branch }}

    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ccache libncurses-dev gawk flex bison \
            unzip gettext zlib1g-dev libssl-dev python3 python3-pyelftools rsync \
            subversion swig texinfo uglifyjs upx-ucl xmlto xxd xz-utils \
            wget curl file

      - name: 克隆 Lean LEDE 源码
        run: |
          git clone --depth 1 -b "${BRANCH}" https://github.com/coolsnowwolf/lede openwrt
          cd openwrt
          echo "LEAN_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: 应用自定义配置
        run: |
          cd openwrt
          # 1. 基础配置
          cat > .config <<'EOF'
  CONFIG_TARGET_ramips=y
  CONFIG_TARGET_SUBTARGET_mt7621=y
  CONFIG_TARGET_PROFILE_XIAOMI_MI_ROUTER_CR660X=y
  CONFIG_PACKAGE_luci=y
  CONFIG_PACKAGE_luci-theme-argon=y
  CONFIG_PACKAGE_luci-app-argon-config=y
  CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
  CONFIG_PACKAGE_luci-app-mosdns=y
  CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y
  CONFIG_PACKAGE_kmod-mt7915-firmware=y
  CONFIG_PACKAGE_kmod-mt7915e=y
  CONFIG_PACKAGE_kmod-mt76-xqca=y
  CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
  CONFIG_PACKAGE_kmod-leds-gpio=y
  EOF

          # 2. 启用闭源 mt_wifi (MT7915E DBDC)
          cat >> .config <<'EOF'
  # MediaTek 闭源 WiFi 驱动
  CONFIG_PACKAGE_mt_wifi=y
  CONFIG_MTK_CHIP_MT7915E_DBDC=y
  # 关闭开源 mt76 相关（避免冲突）
  # CONFIG_PACKAGE_kmod-mt7915e is not set
  # CONFIG_PACKAGE_kmod-mt76-xqca is not set
  EOF

          # 3. 拷贝 uci-defaults（含 WiFi 配置）
          cp "${GITHUB_WORKSPACE}/files/etc/uci-defaults/99-cr660x" files/etc/uci-defaults/
          chmod +x files/etc/uci-defaults/99-cr660x

      - name: 更新 feeds 并安装
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 删除开源 mt76 避免冲突（可选，视编译结果）
        working-directory: ./openwrt
        run: |
          # mt_wifi 会 CONFLICTS kmod-mt7615d_dbdc，但保留 kmod-mt7915-firmware 一般无害
          # 如需彻底移除开源驱动，取消下面注释
          # find ./package -name "*mt76*" -type d | xargs -r rm -rf
          # find ./package -name "*mt7915*" -type d | xargs -r rm -rf
          true

      - name: 生成默认配置
        working-directory: ./openwrt
        run: |
          make defconfig

      - name: 下载编译依赖
        working-directory: ./openwrt
        run: |
          make download -j$(nproc) || true

      - name: 编译固件
        working-directory: ./openwrt
        run: |
          make -j$(nproc) V=s

      - name: 收集固件
        run: |
          mkdir -p out
          cd openwrt
          case "${DEVICE:-all}" in
            all) PROFILES="xiaomi_mi-router-cr6606 xiaomi_mi-router-cr6608 xiaomi_mi-router-cr6609" ;;
            cr6606|cr6608|cr6609) PROFILES="xiaomi_mi-router-${DEVICE}" ;;
            *) PROFILES="xiaomi_mi-router-cr6606 xiaomi_mi-router-cr6608 xiaomi_mi-router-cr6609" ;;
          esac
          for P in ${PROFILES}; do
            find bin/targets/ramips/mt7621 -maxdepth 1 -name "*${P}*" \
              \( -name '*.bin' -o -name '*.itb' -o -name '*.manifest' \) \
              -exec cp -v {} ../out/ \;
          done
          cd ..
          ( cd out && sha256sum -- * > SHA256SUMS )
          ls -lh out

      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.LEAN_COMMIT }}-cr660x-mtk-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30

      - name: 发布到 GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cr660x-${{ env.LEAN_COMMIT }}-mtk-${{ github.run_number }}
          name: OpenWrt Lean LEDE for CR660X (Closed-Source mt_wifi) #${{ github.run_number }}
          body: |
            ## OpenWrt Lean LEDE · Xiaomi CR660X (Closed-Source mt_wifi)

            使用 **Lean LEDE 源码全量编译**，WiFi 驱动为 **MediaTek 闭源 mt_wifi (MT7915E DBDC)**。

            | 项目 | 内容 |
            | --- | --- |
            | 设备 | CR6606 / CR6608 / CR6609 (ramips/mt7621) |
            | 管理地址 | http://192.168.66.1（默认无密码） |
            | WiFi | 双频合一 `cr660x` / `12345678` |
            | 驱动 | **闭源 mt_wifi (MT7915E_DBDC)** + 厂商 .dat 校准文件 |
            | 主题 | Argon（第三方） |
            | DNS | MosDNS v5（第三方） |
            | 源码 | coolsnowwolf/lede@${{ env.LEAN_COMMIT }} |

            ### 刷机说明
            - 已在 OpenWrt：用 `*-squashfs-sysupgrade.bin` 升级
            - 首次刷入：先刷 `*-initramfs-kernel.bin` 进入临时系统，再刷 sysupgrade

            ### 注意
            - 闭源驱动与内核版本强绑定，升级内核需重新编译
            - 使用 MediaTek 专用配置工具（/lib/wifi/mt7615.lua + /etc/wireless/mt7615/*.dat）
            - 若遇问题可尝试开源版 workflow

            校验文件见 `SHA256SUMS`。
          files: out/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false